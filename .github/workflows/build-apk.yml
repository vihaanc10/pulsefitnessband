name: Build Pulse APK

# Builds the app on GitHub's servers every time the code changes and puts the install file
# (Pulse.apk) on the Releases page, so nobody needs Android Studio just to install it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build the app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the install file
        run: cp app/build/outputs/apk/debug/app-debug.apk Pulse.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-apk
          path: Pulse.apk

      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Pulse.apk --title "Pulse (latest)" \
            --notes "Download Pulse.apk, open it on your Android phone and tap Install. See the README for the two-minute steps."
