name: Build Pulse APK

# Builds the app on GitHub's servers every time the code changes and puts the install file
# (Pulse.apk) on the Releases page, so nobody needs Android Studio just to install it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Builds run one after another, so two quick pushes never fight over the "latest" release.
concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare the signing key (only if you added it in GitHub settings)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.PULSE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pulse.jks"
            echo "PULSE_KEYSTORE_PATH=$RUNNER_TEMP/pulse.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          fi

      - name: Build the app
        shell: bash
        env:
          PULSE_KEYSTORE_PASSWORD: ${{ secrets.PULSE_KEYSTORE_PASSWORD }}
          PULSE_KEY_ALIAS: ${{ secrets.PULSE_KEY_ALIAS }}
          PULSE_KEY_PASSWORD: ${{ secrets.PULSE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "true" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          ./gradlew $TASK --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show the errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|AAPT|What went wrong|Resource|Execution failed" build.log | head -25 | while IFS= read -r line; do echo "::error::${line:0:900}"; done

      - name: Name the install file
        shell: bash
        run: |
          if [ "$SIGNED" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk Pulse.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk Pulse.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-apk
          path: Pulse.apk

      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Pulse.apk --title "Pulse (latest)" \
            --notes "Download Pulse.apk, open it on your Android phone and tap Install. See the README for the two-minute steps."
